name: Vicgital.Calendar.Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GH_PACKAGE_USERNAME: ${{ secrets.GH_PACKAGE_USERNAME }}
  GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
  definitionProject: "src/Vicgital.Calendar.Service.Definition/Vicgital.Calendar.Service.Definition.csproj"
  startupProject: "src/Vicgital.Calendar.Service/Vicgital.Calendar.Service.csproj"
  artifactId: "build-artifact"

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Builds .NET Project
        uses: vicgital/cicd/actions/dotnetBuild@main
        with:
          startupProject: ${{ env.startupProject }}
          artifactId: ${{ env.artifactId }}

      - name: Publish Nuget Package
        if: github.ref_name == 'develop' || github.ref_name == 'main'
        uses: vicgital/cicd/actions/dotnetNugetPublish@main
        with:
          startupProject: ${{ env.definitionProject }}
          githubPublishPackageToken: ${{ secrets.GITHUB_TOKEN }}
          skipDotNetSetup: true
          skipCheckout: true

  ## TODO: Add a test job here
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     ...
  
  
  docker-publish:
    runs-on: ubuntu-latest
    needs: [build] # TODO: add test
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    outputs:
      docker_image_tag: ${{ steps.dockerPush.outputs.docker_image_tag }}
    steps:
      - name: Docker Build and Push
        uses: vicgital/cicd/actions/dotnetDockerBuildAndPush@main
        id: dockerPush
        with:
          startupProject: ${{ env.startupProject }}
          artifactId: ${{ env.artifactId }}         
          githubPublishImageToken: ${{ secrets.GITHUB_TOKEN }}
