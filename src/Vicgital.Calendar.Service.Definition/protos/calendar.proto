syntax = "proto3";
option csharp_namespace = "Vicgital.Calendar.Service.Definition";


service Calendar {	

	rpc GetQuarter (QuarterRequest) returns (QuarterModel);
	rpc GetQuartersByYear (YearRequest) returns (QuartersReply);
	rpc GetQuarterByDate (DateRequest) returns (QuarterModel);

	rpc GetWeek (WeekRequest) returns (WeekModel);
	rpc GetWeeksByQuarter (QuarterRequest) returns (WeeksReply);
	rpc GetWeekByDate (DateRequest) returns (WeekModel);

	rpc GetFortnight (FortnightRequest) returns (FortnightModel);
	rpc GetFortnightsByYear (YearRequest) returns (FortnightsReply);
	rpc GetFortnightsByMonthAndYear (MonthRequest) returns (FortnightsReply);


}

message EmptyRequest {}

message DateRequest {
	string date = 1;
}

message WeekRequest {
	int32 id = 1;
	string code = 2;
}

message WeeksReply {
	repeated WeekModel weeks = 1;
}

message WeekModel {
	int32 id = 1;
	string code = 2;
	string startDate = 3;
	string endDate = 4;
}

message YearRequest {
	int32 year = 1;
}

message QuarterCodeRequest {
	string code = 2;
}

message QuarterRequest {
	int32 id = 1;
	string code = 2;
}

message QuartersReply {
	repeated QuarterModel quarters = 1;
}

message QuarterModel {
	int32 id = 1;
	string code = 2;
	string startDate = 3;
	string endDate = 4;
}




message FortnightRequest {
	int32 id = 1;
	string code = 2;
}

message MonthRequest {
	int32 month = 1;
	int32 year = 2;
}

message FortnightsReply {
	repeated FortnightModel fortnights = 1;
}

message FortnightModel {
	int32 id = 1;
	string code = 2;
	string startDate = 3;
	string endDate = 4;
}